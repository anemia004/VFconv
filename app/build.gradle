plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vfconv.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.vfconv.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        viewBinding true
    }

    signingConfigs {
        release {
            storeFile file("$rootDir/vfconv-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "vfconv123"
            keyAlias System.getenv("KEY_ALIAS") ?: "vfconv-key"
            keyPassword System.getenv("KEY_PASSWORD") ?: "vfconv123"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def version = variant.versionName
            def formattedDate = new Date().format('yyyyMMdd')
            outputFileName = "VFconv_${version}_${formattedDate}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // FFmpeg library (real conversion)
    implementation 'com.github.hiteshsondhi88.libffmpeg:FFmpegAndroid:0.2.5'
}
