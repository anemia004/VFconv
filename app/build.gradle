plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vfconv.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.vfconv.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        viewBinding true
    }

    signingConfigs {
        release {
            storeFile file("$rootDir/vfconv-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "vfconv123"
            keyAlias System.getenv("KEY_ALIAS") ?: "vfconv-key"
            keyPassword System.getenv("KEY_PASSWORD") ?: "vfconv123"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def version = variant.versionName
            def formattedDate = new Date().format('yyyyMMdd')
            outputFileName = "VFconv_${version}_${formattedDate}.apk"
        }
    }

    // Add flatDir repository for local AAR
    repositories {
        flatDir {
            dirs 'libs'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.preference:preference:1.2.1'

    // FFmpegKit AAR from GitHub release
    implementation(name: 'ffmpeg-kit-full-gpl', ext: 'aar')
    implementation 'com.arthenica:smart-exception-java:0.2.1'
}

// Download AAR from GitHub release before build
afterEvaluate {
    def aarUrl = 'https://github.com/NooruddinLakhani/ffmpeg-kit-full-gpl/releases/download/v1.0.0/ffmpeg-kit-full-gpl.aar'
    def aarFile = file("${projectDir}/libs/ffmpeg-kit-full-gpl.aar")

    tasks.register("downloadAar") {
        doLast {
            if (!aarFile.parentFile.exists()) {
                aarFile.parentFile.mkdirs()
            }
            if (!aarFile.exists()) {
                println "Downloading AAR from $aarUrl..."
                new URL(aarUrl).withInputStream { i ->
                    aarFile.withOutputStream { it << i }
                }
                println "AAR downloaded to ${aarFile.absolutePath}"
            } else {
                println "AAR already exists at ${aarFile.absolutePath}"
            }
        }
    }

    preBuild.dependsOn("downloadAar")
}
