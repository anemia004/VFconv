plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vfconv.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.vfconv.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // FFmpegKitNext AAR (local, will be auto-downloaded if missing)
    implementation files('libs/ffmpeg-kit-next-android-gpl.aar')
}

// ---- AUTO-DOWNLOAD AAR TASK ----
task downloadAar {
    doLast {
        def aarFile = file('libs/ffmpeg-kit-next-android-gpl.aar')
        if (!aarFile.exists()) {
            mkdir 'libs'
            new URL('https://github.com/anemia004/ffmpeg-kit-next/releases/download/v8.1.1/ffmpeg-kit-next-android-gpl.aar')
                .withInputStream { input ->
                    aarFile.withOutputStream { output ->
                        output << input
                    }
                }
            println "FFmpeg AAR downloaded successfully."
        } else {
            println "FFmpeg AAR already exists. Skipping download."
        }
    }
}

// Make every build (sync, assemble, run) download the AAR first if missing
preBuild.dependsOn downloadAar
